<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NSE Swing Scanner</title>
  <meta name="description" content="Daily NSE swing-trade scan results, history and backtest.">
  <meta name="theme-color" content="#0f1419" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Swing Scan">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>Swing Scan</h1>
      <p id="asof" class="muted">Loading…</p>
    </div>
    <div class="top-actions">
      <button id="install" class="chip" hidden>Install</button>
      <button id="refresh" class="icon-btn" aria-label="Refresh data">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section id="view-today" class="view" aria-label="Today"></section>
    <section id="view-history" class="view" aria-label="History" hidden></section>
    <section id="view-backtest" class="view" aria-label="Backtest" hidden></section>
    <p class="disclaimer">Educational tool only — not investment advice. Signals come from an automated end-of-day scan and may be wrong or stale.</p>
  </main>

  <div id="toast" role="status" aria-live="polite" hidden></div>

  <nav class="tabs" aria-label="Sections">
    <button data-view="today" class="active" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8M15 7h6v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Today</span>
    </button>
    <button data-view="history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v5l3 2M21 12a9 9 0 1 1-9-9 9 9 0 0 1 9 9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>History</span>
    </button>
    <button data-view="backtest">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Backtest</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
